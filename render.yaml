# Servicio independiente del backend.
# sync: false solicita el valor en Render; las credenciales no se guardan aquí.

services:
  - type: web
    # Servicio aislado para el repositorio de pruebas EPIC9-PRUEBAS.
    # No comparte servicio ni despliegue con el repositorio UMSSPIRA original.
    name: umsspira-epic9-pruebas-api
    runtime: node

    # Elegir al crear el servicio la región más cercana al PostgreSQL utilizado.
    region: virginia

    # El plan gratuito se duerme tras 15 minutos sin tráfico.
    plan: free

    # El repositorio de pruebas publica el contenido integrado de Epic 9 en main.
    branch: main

    # La raíz conserva pnpm-workspace.yaml y el lockfile; solo se compila la API.
    rootDir: .

    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter api build
    startCommand: pnpm --filter api start

    # Devuelve 200 cuando la API puede leer la BD. Render lo usa de health check.
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NODE_ENV
        value: production
      # Datos falsos de integración. Usar production para la base del sistema real.
      - key: APP_ENV
        value: dev
      - key: AUTH_RATE_LIMIT_STORE
        value: memory

      # --- Secretos: Render los pide en el dashboard ---
      # Ver apps/api/.env.example para el contenido.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false

      # Origen del frontend aislado, sin /login. Render lo solicita al crear el servicio.
      - key: CORS_ORIGINS
        sync: false

      # Configurar con un proveedor real para registro, verificación y activación.
      # En Free, los puertos SMTP 25/465/587 están bloqueados: consultar la guía.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
